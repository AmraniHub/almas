name: Rebuild the website

# Vercel builds the website on every push. This job only asks Vercel for a fresh build when run by hand
# ("Run workflow" in the Actions tab), through the project's deploy hook (repo secret VERCEL_DEPLOY_HOOK).
# No schedule: the catalogue does not change by itself today, so a daily build would only spend Vercel builds.
on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel for a fresh build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK is not set: nothing to do"; exit 0; fi
          curl -sf -X POST "$HOOK" -o /dev/null && echo "rebuild requested"
