name: Daily website rebuild

# Vercel builds the website (site/build.py -> public/) on every push. Prices change at the till without a push,
# so this asks Vercel for a fresh build once a day through the project's deploy hook (repo secret
# VERCEL_DEPLOY_HOOK). GitHub runs scheduled jobs late (hours, on this account); "Run workflow" rebuilds at once.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel for a fresh build from the till's catalogue
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK is not set"; exit 1; fi
          curl -sf -X POST "$HOOK" -o /dev/null && echo "rebuild requested"
