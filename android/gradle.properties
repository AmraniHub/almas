org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# This app has no native Android modules; skip Flutter's forced NDK download
# path so Android Studio sync does not depend on SDK package installs.
skipNdkDownload=true
# Keep bundle/release packaging on Flutter's default ABI behavior. Per-ABI APK
# splitting was only a local emulator workaround and interferes with Play AAB
# generation from this project.
android.suppressUnsupportedCompileSdk=36
org.gradle.internal.http.connectionTimeout=600000
org.gradle.internal.http.socketTimeout=600000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=2000
