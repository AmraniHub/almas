name: almas
description: Almas spices - the shop's website (almas-epices.vercel.app) in a native Android shell.
publish_to: "none"
version: 1.2.0+13

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The shop itself: the website, full screen
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0

  # Links that leave the site (WhatsApp, phone, Waze, Maps, Instagram...)
  url_launcher: ^6.3.1

  # Last language page the visitor opened
  shared_preferences: ^2.3.5

  # The site's "share my order" picture goes to the Android share sheet through
  # MainActivity + ShareProvider (no plugin: share_plus pins an AGP/Kotlin
  # buildscript that is not in the Gradle cache).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
