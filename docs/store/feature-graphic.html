<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1024px;height:500px;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;
    background:radial-gradient(circle at 78% 30%,#f3dfc0 0,#f6efe6 45%,#efe4d6 100%);color:#211a17;position:relative}
  .left{position:absolute;left:56px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:18px}
  .logo{width:96px;height:96px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(80,50,30,.12)}
  .logo img{width:78px;height:78px}
  h1{font-family:Georgia,serif;font-weight:400;font-size:46px;line-height:1.05;margin:0}
  .ar{font-size:30px;font-weight:700;color:#b5462c;margin:14px 0 0;direction:rtl;text-align:left}
  .tag{font-size:22px;line-height:1.4;color:#5a4a40;margin-top:18px}
  .pill{display:inline-block;margin-top:22px;background:#211a17;color:#fff;font-weight:600;font-size:18px;padding:12px 22px;border-radius:999px}
  .phone{position:absolute;top:44px;width:212px;height:377px;border-radius:30px;overflow:hidden;
    box-shadow:0 18px 40px rgba(60,35,20,.25);border:7px solid #211a17;background:#211a17}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:23px}
  .p1{left:560px;transform:rotate(-4deg)}
  .p2{left:770px;top:70px;transform:rotate(4deg)}
</style></head><body>
  <div class="left">
    <div class="brand"><div class="logo"><img src="../../app/assets/branding/almas_logo.png"></div>
      <h1>Almas<br>Spices &amp; Herbs</h1></div>
    <div class="ar">معشبة ألماس</div>
    <div class="tag">Order spices and herbs by the kilo from our shop in Ksar Sghir, for homes, restaurants and hotels.</div>
    <div><span class="pill">Order on WhatsApp</span></div>
  </div>
  <div class="phone p1"><img src="shot2-catalog.png"></div>
  <div class="phone p2"><img src="shot4-cart.png"></div>
</body></html>
